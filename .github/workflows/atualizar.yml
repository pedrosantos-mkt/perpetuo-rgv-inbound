name: Atualizar painel

on:
  schedule:
    - cron: '17 10 * * *'   # 7h17 de Brasília (UTC-3): o painel só mostra dias fechados, então uma vez por dia basta
  workflow_dispatch: {}    # botão "Atualizar agora" da página e manual

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Coletar Meta e HubSpot
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: ./atualizar.sh
      - name: Publicar na Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d3lbulDpm0oan3IzFejyQUYn
          VERCEL_PROJECT_ID: prj_w0ePOTGYttVRJEG4LvbJBgagCtA1
        run: npx --yes vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN"
