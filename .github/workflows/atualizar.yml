name: Atualizar painel

on:
  schedule:
    - cron: '17 0,9,12,15,18,21 * * *'   # 6h17, 9h17, 12h17, 15h17, 18h17 e 21h17 de Brasília (UTC-3); sem madrugada
  workflow_dispatch: {}    # botão "Atualizar agora" da página e manual

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guarda o clarity.json do dia no repositório
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Coletar Meta e HubSpot
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          VENDAS_URL: ${{ secrets.VENDAS_URL }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
        run: ./atualizar.sh
      - name: Guardar o Clarity do dia
        run: |
          git diff --quiet -- clarity.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add clarity.json && git commit -m 'Clarity do dia [skip ci]' && git push || echo 'não deu para guardar o clarity.json'
      - name: Publicar na Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d3lbulDpm0oan3IzFejyQUYn
          VERCEL_PROJECT_ID: prj_w0ePOTGYttVRJEG4LvbJBgagCtA1
        run: npx --yes vercel@59.1.4 deploy --prod --yes --token "$VERCEL_TOKEN"
