<title>Perpétuo RGV — Funil Inbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Rethink+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cabeçalho do ciclo → resumo → funil com metas → ritmo e cenário → faturamento → público, páginas, criativos → dia a dia → campanhas */
:root{
  --bg:#0d0d0d; --panel:#1a1a1a; --panel-2:#202020; --line:rgba(254,0,38,.35); --line-soft:rgba(255,255,255,.09);
  --fg:#ffffff; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.42);
  --red:#fe0026; --red-2:#ff3352; --red-deep:#b8001c; --red-soft:rgba(254,0,38,.12); --on-red:#ffffff;
  --ok:#3ec46d; --warn:#ff8a1f; --bad:#ff4d5e;
  --ink-rgb:255,255,255; --shade-rgb:0,0,0; --red-rgb:254,0,38; --ok-rgb:62,196,109;
  --f-body:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Rethink Sans",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f2f2; --panel:#ffffff; --panel-2:#f7f7f7; --line:rgba(184,0,28,.32); --line-soft:rgba(20,20,20,.1);
  --fg:#141414; --muted:#5c5c5c; --faint:#808080;
  --red:#d1001f; --red-2:#fe0026; --red-deep:#b8001c; --red-soft:rgba(209,0,31,.08); --on-red:#ffffff;
  --ok:#1d8a46; --warn:#b85c00; --bad:#c8102e;
  --ink-rgb:20,20,20; --shade-rgb:20,20,20; --red-rgb:209,0,31; --ok-rgb:29,138,70;
  color-scheme:light;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
h1 span,h2 span{color:var(--red)}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.top h1{margin:10px 0 0;font-family:var(--f-display);font-size:clamp(30px,4.6vw,48px);font-weight:400;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.top p{margin:8px 0 0;color:var(--muted);font-size:14px}
.sel-ciclo{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--f-body);color:var(--muted)}
.sel-ciclo select{appearance:none;border:1px solid var(--line-soft);background:var(--panel);color:var(--fg);font:600 13px/1 var(--f-body);padding:8px 30px 8px 12px;border-radius:999px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sel-ciclo select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:rgba(var(--ink-rgb),.04)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.crm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-soft);border-radius:18px;background:var(--panel);overflow:hidden}
.crm>div{padding:18px 16px;border-left:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;min-width:0}
.crm>div:first-child{border-left:0}
.crm h5{margin:0;font:600 13px/1.2 var(--f-body);color:var(--fg);min-height:2.4em}
.crm .v{font:700 30px/1.1 var(--f-display);color:var(--fg)}
.crm .bar{height:6px;border-radius:99px;background:rgba(var(--ink-rgb),.08);margin:4px 0 6px}
.crm .bar i{display:block;height:100%;border-radius:99px;background:var(--red);min-width:4px}
.crm .ln{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.crm .ln b{color:var(--fg);font-weight:600;white-space:nowrap}
.crm .ln b.ok{color:var(--ok)}.crm .ln b.warn{color:var(--warn)}.crm .ln b.bad{color:var(--bad)}.crm .ln b.cinza{color:var(--faint)}
.crm .custo{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line-soft);font-size:12.5px;color:var(--muted)}
.crm .custo b{display:block;font:700 18px/1.3 var(--f-display);color:var(--fg)}
@media (max-width:1100px){.crm{grid-template-columns:repeat(4,minmax(0,1fr))}.crm>div{border-top:1px solid var(--line-soft)}}
@media (max-width:640px){.crm{grid-template-columns:repeat(2,minmax(0,1fr))}}
details.ler{border:1px solid var(--line-soft);border-radius:18px;background:var(--panel);padding:16px 20px}
details.ler summary{cursor:pointer;font:600 14px/1.2 var(--f-body);color:var(--fg)}
details.ler dl{display:grid;grid-template-columns:200px 1fr;gap:10px 24px;margin:16px 0 4px}
details.ler dt{font-weight:700;color:var(--fg);font-size:13.5px}
details.ler dd{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
@media (max-width:640px){details.ler dl{grid-template-columns:1fr;gap:2px}details.ler dd{margin-bottom:10px}}
.stamp{font-size:12px;color:var(--faint);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tema{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-soft);background:var(--panel);color:var(--muted);font:600 12px/1 var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tema:hover{color:var(--fg);border-color:var(--line)}
.tema:focus-visible,.ver:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:640px){.stamp{align-items:flex-start;text-align:left}}
.refresh{appearance:none;border:1px solid var(--red);background:transparent;color:var(--red);font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:4px;cursor:pointer}
.refresh:hover{background:var(--red-soft)}
.refresh:disabled{opacity:.55;cursor:wait}
.refresh:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.refresh-msg{max-width:260px;line-height:1.4}
.tema-ico{width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,transparent 50%);border:1.5px solid var(--fg)}

/* resumo */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-block:24px}
.sum > div{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sum b{font-family:var(--f-display);font-size:clamp(20px,2.2vw,26px);white-space:nowrap;font-weight:700;letter-spacing:-.02em}
.sum small{color:var(--muted);font-size:12px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* blocos */
.detail{border:1px solid var(--line-soft);border-radius:18px;background:linear-gradient(180deg,var(--panel),var(--bg) 70%);padding:24px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:34px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-t h4{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.sec-t small{color:var(--faint);font-size:12px}
.note{font-size:12px;color:var(--faint);line-height:1.5;max-width:80ch;margin:10px 0 0}

/* funil */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr) 78px) minmax(0,1fr);align-items:stretch}
.stage{min-width:0;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:5px}
.stage.key{border-color:var(--red);background:linear-gradient(180deg,rgba(var(--red-rgb),.14),var(--panel-2))}
.stage span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.stage b{font-family:var(--f-display);font-size:clamp(17px,1.8vw,22px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.stage small{font-size:11px;color:var(--faint)}
.rate{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding-inline:2px}
.rate b{font-size:13px;font-weight:800;white-space:nowrap}
.rate span{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);line-height:1.2}
.rate::before{content:"→";color:var(--faint);font-size:14px}
.meta-f{font-size:10px;color:var(--faint);line-height:1.3}
.stage .meta-f.ok{color:var(--ok)} .stage .meta-f.warn{color:var(--warn)} .stage .meta-f.bad{color:var(--bad)}
@media (max-width:820px){
  .funnel{grid-template-columns:1fr}
  .stage{flex-direction:row;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px}
  .stage span{flex:1 1 auto}
  .rate{flex-direction:row;justify-content:center;gap:8px;padding-block:6px}
  .rate::before{content:"↓"}
}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;background:rgba(var(--shade-rgb),.14);min-width:0}
.kpi.hl{border-color:var(--red);background:var(--red-soft)}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:13px;font-weight:600}
.kpi small{font-size:12px;color:var(--muted)}

/* ritmo */
.ritmo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ritmo-grid{grid-template-columns:1fr}}
.ritmo-card{border:1px solid var(--line-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:rgba(var(--shade-rgb),.12)}
.ritmo-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ritmo-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ritmo-nums div{display:flex;flex-direction:column;gap:2px}
.ritmo-nums b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ritmo-nums span{font-size:12px;color:var(--muted)}
.ritmo-bar{position:relative;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.ritmo-bar i{position:absolute;top:0;bottom:0;display:block}
.ritmo-bar .real{left:0;background:var(--red);border-radius:99px}
.ritmo-bar .proj{background:repeating-linear-gradient(90deg,rgba(var(--red-rgb),.5) 0 4px,transparent 4px 7px)}
.ritmo-txt{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ritmo-txt b{color:var(--fg)}
.cenario{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--red-soft);display:flex;flex-direction:column;gap:12px}
.cenario-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cenario-t .cap{color:var(--red)}
.cenario-t small{font-size:12px;color:var(--muted)}
.cenario-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.cenario-k{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cenario-k div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cenario-k span{font-size:12px;font-weight:600}
.cenario-k b{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.cenario-k small{font-size:12px;color:var(--muted)}

/* gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--panel-2);color:var(--fg);box-shadow:0 6px 18px rgba(var(--shade-rgb),.25);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;white-space:pre;font-variant-numeric:tabular-nums;transform:translate(-50%,-108%);z-index:2}
.tip[hidden]{display:none}
.lg{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hrow{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;align-items:center;gap:14px}
.hlab{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{height:20px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.htrack i{display:block;height:100%;border-radius:5px}
.hval{font-size:13px;color:var(--muted);text-align:right}
.hval b{color:var(--fg)}
@media (max-width:640px){.hrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.htrack{grid-column:1/-1;order:3}}

/* tabelas: cabem na largura; no celular cada linha vira um cartão */
.tw{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.tw.scroll{max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
td{white-space:nowrap}
td:first-child{white-space:normal}
th{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);vertical-align:bottom;line-height:1.25}
.tw.scroll thead th{position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;padding-left:12px}
td:first-child{color:var(--fg);overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:1px solid var(--line);background:rgba(var(--shade-rgb),.18)}
th.grp{text-align:center;color:var(--faint);font-size:9.5px}
.sep{border-right:1px solid var(--line-soft)}
td.pg{font-size:12px}
.st{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:4px;margin-right:8px;white-space:nowrap}
.st.on{background:rgba(var(--ok-rgb),.15);color:var(--ok)} .st.off{background:var(--line-soft);color:var(--faint)}
tr.extra td{color:var(--muted)}
tr.atual td{background:var(--red-soft)}
tr.atual .st,tr .st.off{margin-left:8px}
.cre-nome{display:flex;align-items:center;gap:10px;min-width:0}
.cre-nome img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:0 0 36px;background:var(--line-soft)}
.cre-nome span{min-width:0;overflow-wrap:anywhere}
.ver{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);color:var(--red)}
.ver:hover{background:var(--red-soft)}
.ver svg{width:15px;height:15px}
.cre-grid{display:grid;grid-template-columns:1fr;gap:18px}
.cre-box h5{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em}
.cre-box.bom h5{color:var(--ok)} .cre-box.ruim h5{color:var(--bad)}
@media (max-width:980px){
  .tw{border:0;overflow:visible} .tw.scroll{max-height:none}
  table,thead,tbody,tfoot,tr,td{display:block}
  thead{display:none}
  tr{border:1px solid var(--line-soft);border-radius:12px;margin-bottom:10px;padding:6px 0;background:var(--panel)}
  tfoot tr{border-color:var(--line)}
  td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 12px;text-align:right}
  td::before{content:attr(data-l);color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left}
  td:first-child{font-weight:700;font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);margin-bottom:4px;text-align:left}
  td:first-child::before{content:none}
  .sep{border-right:0}
  tfoot td{background:transparent;border-top:0}
}
footer{margin-top:28px;font-size:12px;color:var(--faint);line-height:1.6;max-width:95ch}
footer p{margin:0 0 8px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow">Método RGV · Perpétuo</span>
      <h1>Funil <span>inbound</span> do ciclo</h1>
      <p id="sub"></p>
    </div>
    <div class="stamp"><label class="sel-ciclo" id="sel-wrap" hidden><span>Ciclo</span><select id="ciclo"></select></label><button class="tema" id="tema" type="button" aria-pressed="false"><span class="tema-ico" aria-hidden="true"></span><span id="tema-txt">Tema claro</span></button><span id="stamp"></span><button class="refresh" id="refresh" type="button" hidden>Atualizar agora</button><span class="refresh-msg" id="refresh-msg" aria-live="polite"></span></div>
  </header>
  <section class="sum" id="sum"></section>
  <section class="detail" id="detail" aria-live="polite"></section>
  <footer id="foot"></footer>
</div>

<script>
let DATA = __DATA__;
const DATA0 = DATA, HIST = DATA.historico||[], LISTA = __LISTA__;   // ciclo atual embutido; os fechados vêm de c/<ciclo>.json
const HORAS=[6,9,12,15,18,21];   // horários das rodadas (BRT, aos :17), declarado antes do render
const B = DATA.base;
// metas de cada etapa: CPM pela base dos 30 dias antes do ciclo; CTR, connect e conversão da página definidos pelo time; lead e SQL pela rampa "Operação 3.000 leads"
const META = {
  cpm: Math.round(B.cpm), ctr: .02, connect: .80, conv: .05,
  cpl: 330, sqlTx: .15, custoSql: 2200,
};

const brl = (v,d=0) => v==null||!isFinite(v) ? "—" : "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const int = v => v==null||!isFinite(v) ? "—" : Math.round(v).toLocaleString("pt-BR");
const pct = (v,d=1) => v==null||!isFinite(v) ? "—" : (v*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const dec = (v,d=1) => v==null||!isFinite(v) ? "—" : v.toLocaleString("pt-BR",{maximumFractionDigits:d});
const kfmt = v => v>=1e6 ? (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi" : v>=1e3 ? (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil" : int(v);
const dBR = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
const div = (a,b) => b ? a/b : null;
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="text") e.textContent=v; else e.setAttribute(k,v);} kids.flat().forEach(k=>k!=null&&e.append(k)); return e; };
// tom em relação à meta: "menor é melhor" por padrão
const tone = (v,meta,menor=true) => v==null||!isFinite(v)||meta==null||!isFinite(meta) ? "" : (menor ? (v<=meta?"ok":v<=meta*1.15?"warn":"bad") : (v>=meta?"ok":v>=meta*.85?"warn":"bad"));
const tlabel = t => t==="ok"?"dentro da meta":t==="warn"?"perto da meta":t==="bad"?"fora da meta":"";

let C, K, BM, D, ATE, FIM, INI, diasCorr, diasRest, metaAte, SM, visitas, cliquesPag, conv, connect, cpl, custoSql, txSql, FECH, GG, GR, SPT, LT, STT, cplT, custoSqlT, txSqlT;
function deriva(){
  C = DATA.ciclo; K = DATA.k; BM = DATA.bm; D = DATA.daily; FECH = !!C.fechado;
  ATE = new Date(DATA.ate+"T12:00:00"); FIM = new Date(C.fim+"T12:00:00"); INI = new Date(C.ini+"T12:00:00");
  diasCorr = D.length; diasRest = Math.max(0, Math.round((FIM-ATE)/864e5));

// seletor de ciclo: o atual vem embutido; os fechados são lidos de c/<ciclo>.json e guardados aqui
const CACHE_C = {[DATA0.ciclo.nome]: DATA0};
async function trocaCiclo(nome, rolar){
  const sel=document.getElementById("ciclo"); sel.value=nome;
  try{
    if(!CACHE_C[nome]){ sel.disabled=true;
      const r=await fetch("c/"+nome.replace(" ","-")+".json"); if(!r.ok) throw new Error(r.status); CACHE_C[nome]=await r.json(); }
    DATA=CACHE_C[nome]; deriva(); render();
    try{ history.replaceState(null,"",nome===DATA0.ciclo.nome?location.pathname:"#"+nome.replace(" ","-")); }catch(e){}
    if(rolar) window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ sel.value=C.nome; alert("Não consegui abrir o "+nome+" agora."); }
  finally{ sel.disabled=false; }
}
(function(){
  if(!LISTA.length) return;   // sem arquivos dos ciclos fechados (ex.: Artifact), o seletor fica escondido
  const sel=document.getElementById("ciclo");
  [{nome:DATA0.ciclo.nome}, ...[...LISTA].reverse()].forEach((c,i)=>sel.append(el("option",{value:c.nome,text:c.nome+(i?"":" · atual")})));
  sel.addEventListener("change",()=>trocaCiclo(sel.value));
  document.getElementById("sel-wrap").hidden=false;
  const h=decodeURIComponent(location.hash.slice(1)).replace("-"," ");
  if(h && LISTA.some(c=>c.nome===h)) trocaCiclo(h);
})();

(function(){

// próxima atualização automática (7h de Brasília, no minuto 17)
function proximaAtualizacao(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const agora=Number(p.hour)*60+Number(p.minute), h=HORAS.find(h=>h*60+17>agora);
  return h!=null ? `hoje às ${h}h` : `amanhã às ${HORAS[0]}h`;
}
function carimbo(){ document.getElementById("stamp").textContent=FECH ? "Ciclo encerrado · dados coletados em "+DATA.gerado : "Atualizado em "+DATA.gerado+(/vercel\.app$/.test(location.hostname)?" · próxima atualização "+proximaAtualizacao():""); }
setInterval(carimbo,60000);
// botão Atualizar agora (só na versão da Vercel, que tem a função /api/atualizar)
(function(){
  if(!/vercel\.app$/.test(location.hostname)) return;
  const btn=document.getElementById("refresh"), msg=document.getElementById("refresh-msg");
  btn.hidden=false; let timer=null, pedido=0;
  const estado=(t,rodando)=>{msg.textContent=t; btn.disabled=!!rodando;};
  const AVISO="Atualizando os dados… leva uns 10 minutos. A página recarrega sozinha.";
  async function checar(recarregar){
    try{
      const r=await fetch("/api/atualizar",{cache:"no-store"}); const j=await r.json();
      if(j.erro){ if(!recarregar){btn.hidden=true; msg.textContent="";} else estado(j.erro,false); return;}
      if(j.rodando){estado(AVISO,true); clearTimeout(timer); timer=setTimeout(()=>checar(true),20000);}
      else if(recarregar){
        const nova=j.run&&Date.parse(j.run.inicio)>=pedido-60000;
        if(!nova){timer=setTimeout(()=>checar(true),10000); return;}
        if(j.run.conclusion==="success") location.reload(); else estado("A última atualização falhou. Tente de novo.",false); }
      else estado("",false);
    }catch(e){ if(!recarregar){btn.hidden=true; msg.textContent="";} else estado("Sem conexão com o servidor de atualização.",false);}
  }
  btn.addEventListener("click",async()=>{
    estado("Pedindo a atualização…",true); pedido=Date.now();
    try{ const r=await fetch("/api/atualizar",{method:"POST"}); const j=await r.json();
      if(j.erro){estado(j.erro,false);return;}
      setTimeout(()=>checar(true),8000); estado(AVISO,true);
    }catch(e){estado("Não consegui pedir a atualização agora.",false);}
  });
  checar(false);
})();
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(render,150);});
