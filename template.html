<title>Perpétuo RGV — Funil Inbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Rethink+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cabeçalho do ciclo → resumo → funil com metas → ritmo e cenário → faturamento → público, páginas, criativos → dia a dia → campanhas */
:root{
  --bg:#0d0d0d; --panel:#1a1a1a; --panel-2:#202020; --line:rgba(254,0,38,.35); --line-soft:rgba(255,255,255,.09);
  --fg:#ffffff; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.42);
  --red:#fe0026; --red-2:#ff3352; --red-deep:#b8001c; --red-soft:rgba(254,0,38,.12); --on-red:#ffffff;
  --ok:#3ec46d; --warn:#ff8a1f; --bad:#ff4d5e;
  --ink-rgb:255,255,255; --shade-rgb:0,0,0; --red-rgb:254,0,38; --ok-rgb:62,196,109;
  --f-body:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Rethink Sans",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f2f2; --panel:#ffffff; --panel-2:#f7f7f7; --line:rgba(184,0,28,.32); --line-soft:rgba(20,20,20,.1);
  --fg:#141414; --muted:#5c5c5c; --faint:#808080;
  --red:#d1001f; --red-2:#fe0026; --red-deep:#b8001c; --red-soft:rgba(209,0,31,.08); --on-red:#ffffff;
  --ok:#1d8a46; --warn:#b85c00; --bad:#c8102e;
  --ink-rgb:20,20,20; --shade-rgb:20,20,20; --red-rgb:209,0,31; --ok-rgb:29,138,70;
  color-scheme:light;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
h1 span,h2 span{color:var(--red)}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.top h1{margin:10px 0 0;font-family:var(--f-display);font-size:clamp(30px,4.6vw,48px);font-weight:400;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.top p{margin:8px 0 0;color:var(--muted);font-size:14px}
.sel-ciclo{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--f-body);color:var(--muted)}
.sel-ciclo select{appearance:none;border:1px solid var(--line-soft);background:var(--panel);color:var(--fg);font:600 13px/1 var(--f-body);padding:8px 30px 8px 12px;border-radius:999px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sel-ciclo select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.per input{appearance:none;border:1px solid var(--line-soft);background:var(--panel);color:var(--fg);font:600 13px/1 var(--f-body);padding:7px 10px;border-radius:999px;color-scheme:dark}
:root[data-theme="light"] .per input{color-scheme:light}
.per input:focus-visible,.per-x:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.per-x{appearance:none;border:1px solid var(--line-soft);background:transparent;color:var(--muted);font:600 12px/1 var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
.per.ativo input{border-color:var(--red)}
tr.clic{cursor:pointer}
tr.clic:hover td{background:rgba(var(--ink-rgb),.04)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.crm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-soft);border-radius:18px;background:var(--panel);overflow:hidden}
.crm>div{padding:18px 16px;border-left:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;min-width:0}
.crm>div:first-child{border-left:0}
.crm h5{margin:0;font:600 13px/1.2 var(--f-body);color:var(--fg);min-height:2.4em}
.crm .v{font:700 30px/1.1 var(--f-display);color:var(--fg)}
.crm .bar{height:6px;border-radius:99px;background:rgba(var(--ink-rgb),.08);margin:4px 0 6px}
.crm .bar i{display:block;height:100%;border-radius:99px;background:var(--red);min-width:4px}
.crm .ln{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.crm .ln b{color:var(--fg);font-weight:600;white-space:nowrap}
.crm .ln b.ok{color:var(--ok)}.crm .ln b.warn{color:var(--warn)}.crm .ln b.bad{color:var(--bad)}.crm .ln b.cinza{color:var(--faint)}
.crm .custo{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line-soft);font-size:12.5px;color:var(--muted)}
.crm .custo b{display:block;font:700 18px/1.3 var(--f-display);color:var(--fg)}
@media (max-width:1100px){.crm{grid-template-columns:repeat(4,minmax(0,1fr))}.crm>div{border-top:1px solid var(--line-soft)}}
@media (max-width:640px){.crm{grid-template-columns:repeat(2,minmax(0,1fr))}}
details.ler{border:1px solid var(--line-soft);border-radius:18px;background:var(--panel);padding:16px 20px}
details.ler summary{cursor:pointer;font:600 14px/1.2 var(--f-body);color:var(--fg)}
details.ler dl{display:grid;grid-template-columns:200px 1fr;gap:10px 24px;margin:16px 0 4px}
details.ler dt{font-weight:700;color:var(--fg);font-size:13.5px}
details.ler dd{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
@media (max-width:640px){details.ler dl{grid-template-columns:1fr;gap:2px}details.ler dd{margin-bottom:10px}}
[hidden]{display:none!important}
.menu{position:sticky;top:0;z-index:20;display:flex;gap:6px;margin:0 0 18px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.menu button{appearance:none;border:1px solid var(--line-soft);background:var(--panel);color:var(--muted);font:700 13px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:10px 16px;border-radius:999px;cursor:pointer}
.menu button[aria-selected="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.menu button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.cri-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.cri-ctl input,.cri-ctl select{appearance:none;border:1px solid var(--line-soft);background:var(--panel);color:var(--fg);font:500 13px/1 var(--f-body);padding:10px 12px;border-radius:10px}
.cri-ctl input{flex:1 1 220px;min-width:0}
.cri-ctl .seg{display:inline-flex;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.cri-ctl .seg button{appearance:none;border:0;background:var(--panel);color:var(--muted);font:600 12px/1 var(--f-body);padding:10px 12px;cursor:pointer}
.cri-ctl .seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--red)}
.cri-ctl small{color:var(--faint);font-size:12px}
.cri-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cri{border:1px solid var(--line-soft);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cri .thumb{position:relative;aspect-ratio:4/3;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--faint);font:700 12px/1 var(--f-body);letter-spacing:.06em}
.cri .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cri .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;font:700 11px/1 var(--f-body);letter-spacing:.06em;padding:6px 8px;border-radius:6px}
.cri .rk{position:absolute;top:10px;right:10px;background:var(--red);color:var(--on-red);font:800 12px/1 var(--f-body);padding:6px 8px;border-radius:6px}
.cri .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cri .nm{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.cri .nm span{font:600 12.5px/1.35 var(--f-body);color:var(--fg);word-break:break-word}
.cri dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin:0}
.cri dt{font:700 10px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.cri dd{margin:2px 0 0;font:700 14px/1.2 var(--f-body);color:var(--fg)}
.cri dd.ok{color:var(--ok)}.cri dd.warn{color:var(--warn)}.cri dd.bad{color:var(--bad)}
.cri.sem{opacity:.72}
.cri.pg{cursor:default}.cri.pg .cl-t{font:800 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--red);border-top:1px dashed var(--line-soft);padding-top:10px}.cri.pg .thumb{aspect-ratio:16/10}.cri.pg .thumb img{object-position:top}
.cri.pg dl{grid-template-columns:repeat(3,minmax(0,1fr))}
.cri{cursor:pointer;transition:border-color .15s}
.cri:hover{border-color:var(--line)}
.cri:focus-visible{outline:2px solid var(--red);outline-offset:2px}
dialog.det{width:min(1080px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line-soft);border-radius:20px;background:var(--bg);color:var(--fg);overflow:auto}
dialog.det::backdrop{background:rgba(0,0,0,.72)}
.det .in{padding:28px 30px 30px;display:flex;flex-direction:column;gap:22px}
.det .x{position:sticky;top:0;float:right;margin:14px 14px 0 0;appearance:none;border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;z-index:2}
.det h3{margin:0;font:700 clamp(17px,2vw,22px)/1.25 var(--f-body);word-break:break-word;padding-right:30px}
.det .cab{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.det .cab .th{width:150px;aspect-ratio:1;border-radius:14px;background:var(--panel-2);overflow:hidden;position:relative}
.det .cab .th img{width:100%;height:100%;object-fit:cover}
.det .onde{margin:0;padding:0;list-style:none;color:var(--muted);font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.det .diag{display:flex;align-items:center;gap:8px;margin-top:10px;font:800 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.det .diag i{width:10px;height:10px;border-radius:50%;background:var(--warn)}
.det .diag.ok i{background:var(--ok)}.det .diag.bad i{background:var(--bad)}
.det .frase{margin:8px 0 0;font-size:15px;color:var(--fg)}
.det h4{margin:0 0 10px;font:800 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.det .kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.det .kp>div,.det .ab>div,.det .dg>div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 14px 12px;min-width:0}
.det .kp span,.det .ab span,.det .dg span{display:block;font:800 10.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.det .kp b{display:block;margin-top:8px;font:700 clamp(15px,1.6vw,19px)/1.2 var(--f-display)}
.det .kp small,.det .ab small,.det .dg small{display:block;margin-top:5px;font-size:12px;color:var(--faint)}
.det .crit{border:1px solid var(--line);background:var(--red-soft);border-radius:16px;padding:18px 20px}
.det .crit b{display:block;margin:8px 0 6px;font:800 26px/1 var(--f-display);color:var(--red)}
.det .ret{display:flex;flex-direction:column;gap:8px}
.det .ret>div{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px 16px}
.det .ret .t{display:flex;justify-content:space-between;gap:12px;font:800 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.det .ret .t em{font-style:normal;letter-spacing:0;color:var(--fg);white-space:nowrap}
.det .ret .bar{height:7px;border-radius:99px;background:rgba(var(--ink-rgb),.07);margin:9px 0 7px}
.det .ret .bar i{display:block;height:100%;border-radius:99px;background:var(--red);min-width:4px}
.det .ret small{font-size:12px;color:var(--muted)}
.det .ab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.det .ab b,.det .dg b{display:block;margin-top:8px;font:700 19px/1.2 var(--f-display)}
.det .ab small{color:var(--warn)}
.det .dg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.det .dg p{margin:8px 0 0;font:600 13.5px/1.6 var(--f-body)}
.det .dg small.ok{color:var(--ok)}.det .dg small.bad{color:var(--bad)}
.det .sem-v{color:var(--faint);font-size:13px}
@media (max-width:820px){.det .in{padding:20px 16px}.det .cab{grid-template-columns:90px 1fr}.det .cab .th{width:90px}.det .kp{grid-template-columns:repeat(2,minmax(0,1fr))}.det .ab{grid-template-columns:repeat(2,minmax(0,1fr))}.det .dg{grid-template-columns:1fr}}
.mt-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mt{border:1px solid var(--line-soft);border-radius:16px;background:var(--panel);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mt.extra{border-style:dashed}
.mt h5{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:800 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mt h5 small{font:700 11px/1 var(--f-body);letter-spacing:.06em;color:var(--faint)}
.mt .big{display:flex;align-items:baseline;gap:8px;font:700 34px/1 var(--f-display);color:var(--fg)}
.mt .big span{font:600 14px/1 var(--f-body);color:var(--muted)}
.mt .pct{font:800 14px/1 var(--f-body)}
.mt .pct.ok{color:var(--ok)}.mt .pct.warn{color:var(--warn)}.mt .pct.bad{color:var(--bad)}
.mt .barra{position:relative;height:10px;border-radius:99px;background:rgba(var(--ink-rgb),.08)}
.mt .barra i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--red)}
.mt .barra b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.75}
.mt .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.mt .ln b{color:var(--fg);font-weight:700;white-space:nowrap}
.mt .lin{border-top:1px dashed var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.mt .lin .ln span:first-child{color:var(--fg)}
@media (max-width:980px){.mt-grid{grid-template-columns:1fr!important}.mt-top{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fr-bloco{margin-top:18px}
.fr-bloco h5{margin:0 0 10px;font:800 13px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fr-bloco h5 small{font:600 12px/1.2 var(--f-body);letter-spacing:0;text-transform:none;color:var(--faint)}
.fr-bloco td.utm{color:var(--faint);font-size:11.5px;text-align:left;white-space:normal}
.fr-bloco th.utm{text-align:left}
.fr-dia{border:1px solid var(--line-soft);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 6px;background:rgba(var(--ink-rgb),.02)}
.fr-dia .t{display:flex;justify-content:space-between;gap:10px;font:800 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.fr-dia .t small{font:600 11px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--faint)}
.fr-dia svg{display:block;width:100%;height:auto}
.fr-tip{position:absolute;z-index:3;width:260px;pointer-events:none;background:var(--panel-2);border:1px solid rgba(var(--ink-rgb),.14);border-radius:12px;box-shadow:0 12px 30px rgba(var(--shade-rgb),.45);padding:12px 14px 8px;font-size:13px;transform:translateX(-50%)}
.fr-tip:before{content:"";position:absolute;top:-7px;left:calc(50% - 6px + var(--seta,0px));width:12px;height:12px;background:var(--panel-2);border-left:1px solid rgba(var(--ink-rgb),.14);border-top:1px solid rgba(var(--ink-rgb),.14);transform:rotate(45deg)}
.fr-tip .d{font:800 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fr-tip .tot{margin:8px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.fr-tip .tot b{font:700 26px/1 var(--f-display);margin-right:6px}.fr-tip .tot span{font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fr-tip .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line-soft);font-variant-numeric:tabular-nums}
.fr-tip .l:first-of-type{border-top:0}.fr-tip .l b{font-weight:800}.fr-tip .l.z{color:var(--faint)}
.fr-tip .x{color:var(--faint);font-size:12px;padding:2px 0 4px}
.fr-leg{display:flex;flex-wrap:wrap;gap:16px;justify-content:flex-end;color:var(--faint);font-size:11px;margin-top:12px}
.fr-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red);margin-right:6px;vertical-align:-1px}
.fr-leg i.p{opacity:.4}.fr-leg i.m{background:none;border-top:2px dashed rgba(var(--ink-rgb),.55);height:0;width:16px;border-radius:0;vertical-align:3px}
.stamp{font-size:12px;color:var(--faint);text-align:right;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;max-width:560px}
/* desktop: título à esquerda e o bloco de controles encostado à direita, carimbo embaixo dos controles */
@media (min-width:901px){.top{flex-wrap:nowrap}.top>div:first-child{flex:1 1 auto;min-width:0}.stamp{flex:0 0 auto;margin-left:auto}}
/* controles numa linha (ciclo, tema, atualizar); carimbo e aviso embaixo */
.stamp #stamp,.stamp #refresh-msg{order:10;flex-basis:100%}
.stamp #refresh-msg:empty{display:none}
.tema{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-soft);background:var(--panel);color:var(--muted);font:600 12px/1 var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tema:hover{color:var(--fg);border-color:var(--line)}
.tema:focus-visible,.ver:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:640px){.stamp{justify-content:flex-start;text-align:left}}
.refresh{appearance:none;border:1px solid var(--red);background:transparent;color:var(--red);font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:999px;cursor:pointer}
.refresh:hover{background:var(--red-soft)}
.refresh:disabled{opacity:.55;cursor:wait}
.refresh:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.refresh-msg{line-height:1.4}
.tema-ico{width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,transparent 50%);border:1.5px solid var(--fg)}

/* resumo */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-block:24px}
.sum > div{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sum b{font-family:var(--f-display);font-size:clamp(20px,2.2vw,26px);white-space:nowrap;font-weight:700;letter-spacing:-.02em}
.sum small{color:var(--muted);font-size:12px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700}

      kpi("MQL das frentes",int(T.mql),`${pct(div(T.mql,mqlTodos),1)} de ${int(mqlTodos)} MQL · ${int(T.lead)} leads · ${int(T.sql)} SQL · ${int(T.venda)} cadeiras`,true),
      ...FRENTES.map(([fr])=>{const t=totF[fr]; return kpi(fr,int(t.mql),`${pct(div(t.mql,mqlTodos),1)} dos MQL · ${int(t.lead)} lead${t.lead===1?"":"s"} · ${int(t.sql)} SQL · ${int(t.venda)} cadeira${t.venda===1?"":"s"}`);})),
    ...blocos,
    el("div",{class:"fr-leg"},el("span",{},el("i"),"MQL no dia"),el("span",{},el("i",{class:"p"}),"hoje (parcial)"),el("span",{},el("i",{class:"m"}),"meta por dia")),
    el("p",{class:"note",text:"Lead = pessoa que preencheu formulário PERPÉTUO; MQL = negócio do relatório [CICLO] MQL - PERPÉTUO, ligado ao formulário que a pessoa preencheu antes de o negócio nascer; vendas da Planilha Comercial. Cada canal sai da UTM desse formulário. Mídia paga (Meta e Google), formulário sem UTM e negócio sem formulário ficam fora das frentes; por isso o % de todos os MQL não soma 100%. O gráfico mostra o ciclo inteiro; com o filtro De/Até, os dias fora do período ficam em cinza."})));
}

// filtro de datas dentro do ciclo: refaz os quadros a partir dos dados por anúncio × dia (Meta) e dos leads/MQL com data (HubSpot);
// devolve um objeto no mesmo formato do DATA. CPM/CTR/CPC saem das somas; o Google não tem gasto por dia e fica fora num período parcial.
// visões do funil comercial num período: ciclo = MQL do período com a etapa também no período; safra = etapa no período, MQL de qualquer data
const ETP=["contato","sql","marcado","realizado"];
function visoesDe(G,i0,i1){
  if(!G.mql_dt) return {};
  const den=x=>x>=i0&&x<=i1, ciclo={}, safra={};
  ETP.forEach((e,j)=>{ ciclo[e]=G.mql.reduce((a,r,k)=>a+(den(r[0])&&den(G.mql_dt[k][j])?1:0),0); safra[e]=G.safra.reduce((a,x)=>a+(den(x[j])?1:0),0); });
  return {ciclo, safra};
}
function recorta(F, i0, i1){
  const G=F.gran, inteiro=i0===0&&i1===F.daily.length-1;
  const zero=()=>({spend:0,imp:0,clk:0,clk_all:0,lpv:0,clkp:0,v3s:0,p25:0,p50:0,p75:0,p95:0,p100:0,lead:0,mql:0,sql:0,venda:0,receita:0});
  const mapa=()=>{const m=new Map(); return {g:k=>{if(!m.has(k)) m.set(k,zero()); return m.get(k);}, m};};
  const pub=mapa(), pag=mapa(), cre=mapa(), cmp=mapa(), ori=mapa();
  const tot=zero(), pg=zero(), nat=zero();
  const somaM=(o,r,ad)=>{o.spend+=r[2];o.imp+=r[3];o.clk+=r[4];o.clk_all+=r[5];o.lpv+=r[6];o.v3s+=r[7];o.p25+=r[8];o.p50+=r[9];o.p75+=r[10];o.p95+=r[11];o.p100+=r[12];if(!ad.n)o.clkp+=r[4];};
  G.md.forEach(r=>{ if(r[0]<i0||r[0]>i1) return; const ad=G.ads[r[1]];
    [tot,ad.n?nat:pg,pub.g(ad.t),pag.g(ad.p),cre.g(ad.c),cmp.g(ad.m)].forEach(o=>somaM(o,r,ad)); });
  const poe=(a,ch,v)=>{ori.g(a.o)[ch]+=v; for(const [t,w] of Object.entries(a.t)) pub.g(t)[ch]+=v*w; pag.g(a.p)[ch]+=v; if(a.c) cre.g(a.c)[ch]+=v; if(a.m) cmp.g(a.m)[ch]+=v;};
  let lead=0, lpag=0, lnat=0, glead=0, gmql=0, gsql=0; const fx={}; const st={mql:0,contato:0,sql:0,marcado:0,realizado:0,venda:0};
  G.leads.forEach(([d,ai,fi,tp])=>{ if(d<i0||d>i1) return; const a=G.attr[ai]; lead++; if(tp===1) lpag++; if(tp===2) lnat++; if(a.g) glead++;
    poe(a,"lead",1); const f=G.faixas[fi]; fx[f]=(fx[f]||0)+1; });
  G.mql.forEach(([d,ai,sq,ct,mc,rz,vd])=>{ if(d<i0||d>i1) return; const a=G.attr[ai]; st.mql++; st.sql+=sq; st.contato+=ct; st.marcado+=mc; st.realizado+=rz; st.venda+=vd;
    poe(a,"mql",1); if(sq) poe(a,"sql",1); if(a.g){gmql++; gsql+=sq;} });
  let vendas=0, receita=0;
  (G.vendas||[]).forEach(([d,ai,n,val])=>{ if(d<i0||d>i1) return; const a=G.attr[ai]; vendas+=n; receita+=val; poe(a,"venda",n); poe(a,"receita",val); });
  const bmDe=o=>({cpm:o.imp?o.spend/o.imp*1000:null,ctr_link:o.imp?o.clk/o.imp:null,ctr_all:o.imp?o.clk_all/o.imp:null,cpc:o.clk?o.spend/o.clk:null});
  const lista=(mp,ordem)=>[...mp.m.entries()].map(([nome,o])=>({nome,...o}));
  const porNome=(arr)=>Object.fromEntries((arr||[]).map(x=>[x.nome??x.name,x]));
  const gF=F.google, gsp=inteiro&&gF&&!gF.sem_gasto?gF.spend:0;
  // público: mesma ordem do ciclo inteiro; Google com o gasto só no ciclo inteiro
  const pubs=lista(pub); const ordP=(F.publicos||[]).map(x=>x.nome);
  pubs.sort((a,b)=>(ordP.indexOf(a.nome)+1||99)-(ordP.indexOf(b.nome)+1||99));
  pubs.forEach(x=>{ if(/^Google/.test(x.nome)&&gsp){x.spend=gsp; x.imp=gF.imp; x.clk=gF.clk;} });
  const pags=lista(pag); pags.forEach(x=>{ if(/^Google/.test(x.nome)&&gsp) x.spend=gsp; }); pags.sort((a,b)=>(b.spend-a.spend)||(b.lead-a.lead));
  const cF=porNome(F.criativos);
  const cres=lista(cre).filter(x=>x.spend>0||x.lead>0||x.mql>0).map(x=>{const f=cF[x.nome]||{}; return {...x,prev:f.prev,thumb:f.thumb,onde:f.onde,bm:inteiro?f.bm:null};});
  const kF=porNome(F.camps);
  const camps=lista(cmp).filter(x=>x.spend>0||x.lead>0||x.mql>0).map(x=>{const ex=x.nome.startsWith("·"), f=kF[ex?x.nome.slice(1)||null:x.nome]||{};
    return ex?{...x,name:x.nome.slice(1)||null,extra:true}:{...x,name:x.nome,status:f.status};}).sort((a,b)=>(!!a.extra-!!b.extra)||(b.spend-a.spend)||(b.lead-a.lead));
  const oF=porNome(F.origens);
  const oris=lista(ori).map(x=>({...x,pago:/^Meta|^Google/.test(x.nome),spend:x.nome==="Meta · página"?pg.spend:x.nome==="Meta · Lead Ads"?nat.spend:x.nome==="Google Ads"?gsp:0}));
  const ordO=(F.origens||[]).map(x=>x.nome); oris.sort((a,b)=>(ordO.indexOf(a.nome)+1||99)-(ordO.indexOf(b.nome)+1||99));
  const D=F.daily.slice(i0,i1+1), fimIso=D[D.length-1][0];
  return {...F, recorte:inteiro?null:{ini:D[0][0],fim:fimIso},
    ate:fimIso, parcial:F.parcial&&i1===F.daily.length-1,
    ciclo:{...F.ciclo, meta_leads:inteiro?F.ciclo.meta_leads:null},
    k:{...F.k, venda:vendas, receita, spend:tot.spend, imp:tot.imp, clk:tot.clk, lpv:tot.lpv, lead, mql:st.mql, sql:st.sql, lead_tot:lead, lead_pag:lpag, lead_tot_pag:lpag, lead_nativo:lnat,
       pg:{spend:pg.spend,clk:pg.clk,lpv:pg.lpv}, nat:{spend:nat.spend,clk:nat.clk,lpv:nat.lpv}},
    bm:inteiro?F.bm:bmDe(tot), daily:D, publicos:pubs, paginas:pags, criativos:cres, camps, origens:oris,
    crm:F.crm&&{...F.crm, lead_crm:lead, ...st, venda:vendas, ...visoesDe(G,i0,i1)},
    faixas:Object.entries(fx).sort((a,b)=>b[1]-a[1]),
    google:gF?(inteiro?gF:{...gF, sem_gasto:true, recorte:true, spend:0, imp:0, clk:0, lead:glead, mql:gmql, sql:gsql, campanhas:[]}):(glead||gmql?{sem_gasto:true,recorte:true,spend:0,imp:0,clk:0,lead:glead,mql:gmql,sql:gsql,campanhas:[]}:null),
    vendas:inteiro?F.vendas:null};
}

  renderTop();

    el("p",{text:SM?`Metas: ${FECH?"no ciclo encerrado o volume não é comparado com rampa":"o ciclo "+C.nome+" ainda não tem rampa de volume cadastrada"}; custo por MQL, % de SQL, custo por SQL e mídia são comparados com as metas do time.`:`Metas: MQL pela rampa "Operação 3.000 leads" do Instagram/Facebook (51 a 74 por dia a partir de 15/10; antes disso, 51 por dia), ${int(C.meta_leads)} no ciclo. CPL +100k R$ 330, 15% de SQL e custo por SQL R$ 2.200. CPM da meta = média das campanhas [FF] nos 30 dias antes do ciclo (${dBR(B.ini)} a ${dBR(B.fim)}). CTR link 2%, connect 80% e conversão da página 5% (leads de todas as faixas ÷ visitas) são as metas do time.`}));
}
render();

// filtro De/Até dentro do ciclo (só nos ciclos com dados por dia: o atual e os que tiverem "gran")
function preparaPeriodo(){
  const w=document.getElementById("per-wrap"), de=document.getElementById("per-de"), ate=document.getElementById("per-ate"), F=DATA;
  w.classList.remove("ativo"); document.getElementById("per-limpa").hidden=true;
  if(!F.gran||!F.daily.length){ w.hidden=true; return; }
  const ini=F.daily[0][0], fim=F.daily[F.daily.length-1][0];
  de.min=ate.min=ini; de.max=ate.max=fim; de.value=ini; ate.value=fim; w.hidden=false;
}
function aplicaPeriodo(){
  const de=document.getElementById("per-de").value, ate=document.getElementById("per-ate").value;
  const F=CACHE_C[DATA.ciclo.nome]||DATA, dias=F.daily.map(r=>r[0]);
  let i0=dias.indexOf(de), i1=dias.indexOf(ate); if(i0<0) i0=0; if(i1<0) i1=dias.length-1; if(i1<i0) [i0,i1]=[i1,i0];
  const inteiro=i0===0&&i1===dias.length-1;
  DATA=inteiro?F:recorta(F,i0,i1); deriva(); render();
  document.getElementById("per-wrap").classList.toggle("ativo",!inteiro); document.getElementById("per-limpa").hidden=inteiro;
}
["per-de","per-ate"].forEach(id=>document.getElementById(id).addEventListener("change",aplicaPeriodo));
document.getElementById("per-limpa").addEventListener("click",()=>{const F=CACHE_C[DATA.ciclo.nome]||DATA; DATA=F; preparaPeriodo(); deriva(); render();});
preparaPeriodo();

// seletor de ciclo: o atual vem embutido; os fechados são lidos de c/<ciclo>.json e guardados aqui
const CACHE_C = {[DATA0.ciclo.nome]: DATA0};
async function trocaCiclo(nome, rolar){
  const sel=document.getElementById("ciclo"); sel.value=nome;
  try{
    if(!CACHE_C[nome]){ sel.disabled=true;
      const r=await fetch("c/"+nome.replace(" ","-")+".json"); if(!r.ok) throw new Error(r.status); CACHE_C[nome]=await r.json(); }
    DATA=CACHE_C[nome]; preparaPeriodo(); deriva(); render();
    atualizaHash();
    if(rolar) window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ sel.value=C.nome; alert("Não consegui abrir o "+nome+" agora."); }
  finally{ sel.disabled=false; }
}
(function(){
  { const ps=decodeURIComponent(location.hash.slice(1)).split("/"); if(ps.includes("criativos")) mostra("criativos",false); if(ps.includes("paginas")) mostra("paginas",false); if(ps.includes("metas")) mostra("metas",false); if(ps.includes("frentes")) mostra("frentes",false); }
  if(!LISTA.length) return;   // sem arquivos dos ciclos fechados (ex.: Artifact), o seletor fica escondido
  const sel=document.getElementById("ciclo");
  [{nome:DATA0.ciclo.nome}, ...[...LISTA].reverse()].forEach((c,i)=>sel.append(el("option",{value:c.nome,text:c.nome+(i?"":" · atual")})));
  sel.addEventListener("change",()=>trocaCiclo(sel.value));
  document.getElementById("sel-wrap").hidden=false;
  const partes=decodeURIComponent(location.hash.slice(1)).split("/"), h=(partes.find(x=>/^RGV-/.test(x))||"").replace("-"," ");
  if(h && LISTA.some(c=>c.nome===h)) trocaCiclo(h);
})();

// tema: escuro por padrão; claro por escolha da pessoa, guardado neste navegador
(function(){

// próxima atualização automática (7h de Brasília, no minuto 17)
function proximaAtualizacao(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const agora=Number(p.hour)*60+Number(p.minute), h=HORAS.find(h=>h*60+17>agora);
  return h!=null ? `hoje às ${h}h17` : `amanhã às ${HORAS[0]}h17`;
}
function carimbo(){ document.getElementById("stamp").textContent=FECH ? "Ciclo encerrado · dados coletados em "+DATA.gerado : "Atualizado em "+DATA.gerado+(/vercel\.app$/.test(location.hostname)?" · próxima atualização "+proximaAtualizacao():""); }
setInterval(carimbo,60000);
// botão Atualizar agora (só na versão da Vercel, que tem a função /api/atualizar)
(function(){
  if(!/vercel\.app$/.test(location.hostname)) return;
  const btn=document.getElementById("refresh"), msg=document.getElementById("refresh-msg");
  btn.hidden=false; let timer=null, pedido=0;
  const estado=(t,rodando)=>{msg.textContent=t; btn.disabled=!!rodando;};
  const AVISO="Atualizando os dados… leva uns 10 minutos. A página recarrega sozinha.";
  async function checar(recarregar){
    try{
      const r=await fetch("/api/atualizar",{cache:"no-store"}); const j=await r.json();
      if(j.erro){ if(!recarregar){btn.hidden=true; msg.textContent="";} else estado(j.erro,false); return;}
      if(j.rodando){estado(AVISO,true); clearTimeout(timer); timer=setTimeout(()=>checar(true),20000);}
      else if(recarregar){
        const nova=j.run&&Date.parse(j.run.inicio)>=pedido-60000;
        if(!nova){timer=setTimeout(()=>checar(true),10000); return;}
        if(j.run.conclusion==="success") location.reload(); else estado("A última atualização falhou. Tente de novo.",false); }
      else estado("",false);
    }catch(e){ if(!recarregar){btn.hidden=true; msg.textContent="";} else estado("Sem conexão com o servidor de atualização.",false);}
  }
  btn.addEventListener("click",async()=>{
    estado("Pedindo a atualização…",true); pedido=Date.now();
    try{ const r=await fetch("/api/atualizar",{method:"POST"}); const j=await r.json();
      if(j.erro){estado(j.erro,false);return;}
      setTimeout(()=>checar(true),8000); estado(AVISO,true);
    }catch(e){estado("Não consegui pedir a atualização agora.",false);}
  });
  checar(false);
})();
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(render,150);});
